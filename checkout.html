<!DOCTYPE html>
<html lang="pt-BR">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">

 <!-- SEO Meta Tags -->
 <title>Nit Gifts | Finalizar Compra</title>
 <meta name="description" content="Finalize seu pedido com segurança.">
 <meta name="author" content="Nit Gifts">

 <!-- Google Fonts -->
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link
  href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap"
  rel="stylesheet">

 <!-- CSS Stylesheet -->
 <link rel="stylesheet" href="styles.css">
</head>

<body>

 <main class="category-page-container">
  <div class="category-main-content">

   <!-- Back Link -->
   <a href="cart.html" class="cart-back-link">
    <i data-lucide="chevron-left" class="icon-sm"></i>
    Voltar ao carrinho
   </a>

   <!-- Page Title -->
   <h1 class="cart-page-title">Checkout</h1>

   <!-- Checkout Form -->
   <form id="checkout-form">
    <div class="cart-layout-grid">

     <!-- Left Column: Inputs Form -->
     <div class="space-y-8">

      <!-- Dados de Entrega (Carregados do Firebase) -->
      <div class="form-section">
       <h3 class="form-section-title">
        <i data-lucide="truck" class="icon-sm" style="color: var(--color-primary);"></i>
        Dados de Entrega
       </h3>
       
       <div id="user-address-skeleton" style="padding: 16px; border: 1px solid rgba(0,0,0,0.1); border-radius: 8px;">
        <div class="spinner animate-spin" style="display: block; margin: 0 auto;"></div>
        <p style="text-align: center; margin-top: 8px; font-size: 14px;">Carregando seus dados...</p>
       </div>

       <div id="user-address-container" style="display: none; padding: 16px; border: 1px solid rgba(0,0,0,0.1); border-radius: 8px; background: rgba(0,0,0,0.02);">
        <p style="font-weight: 600; margin-bottom: 4px;" id="display-name"></p>
        <p style="font-size: 14px; color: rgba(0,0,0,0.7); margin-bottom: 4px;" id="display-street"></p>
        <p style="font-size: 14px; color: rgba(0,0,0,0.7); margin-bottom: 4px;" id="display-city"></p>
        <p style="font-size: 14px; color: rgba(0,0,0,0.7);" id="display-phone"></p>
       </div>
       
       <p style="font-size: 12px; color: rgba(0,0,0,0.5); margin-top: 12px;">Para alterar seu endereço, acesse <a href="account.html" style="color: var(--color-primary); text-decoration: underline;">Minha Conta</a>.</p>
      </div>

     </div>

     <!-- Right Column: Sticky Summary Panel -->
     <div class="summary-sticky">
      <div class="summary-panel">
       <h3 class="summary-title">Seu Pedido</h3>

       <!-- Compact items list wrapper -->
       <div class="checkout-summary-list" id="checkout-items-list">
        <!-- Rendered dynamically by checkout.js -->
       </div>

       <!-- Price Breakdown -->
       <div class="summary-details" style="border-top: 1px solid rgba(26, 26, 26, 0.1); padding-top: 16px;">
        <div class="summary-row">
         <span class="summary-label">Subtotal</span>
         <span class="summary-value" id="summary-subtotal">R$ 0,00</span>
        </div>
        <div class="summary-row">
         <span class="summary-label">Frete</span>
         <span class="summary-value" id="summary-shipping">R$ 0,00</span>
        </div>
       </div>

       <!-- Grand Total -->
       <div class="summary-divider">
        <span class="summary-total-label">Total</span>
        <span class="summary-total-value" id="summary-total">R$ 0,00</span>
       </div>

       <!-- Submit button with lock and hidden spinner -->
       <button type="submit" class="checkout-btn" id="submit-order-btn">
        <div class="spinner animate-spin" id="submit-spinner" style="display: none;"></div>
        <span id="submit-btn-text" style="display: flex; align-items: center; gap: 8px;">
         <i data-lucide="credit-card" class="icon-sm"></i>
         Ir para o Pagamento
        </span>
       </button>

       <!-- PagBank Security Badge -->
       <div class="pagbank-badge" style="display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 8px;">
        <p class="summary-badge-footer"
         style="display: flex; align-items: center; justify-content: center; gap: 4px;">
         <i data-lucide="shield-check" class="icon-sm" style="width: 12px; height: 12px; color: #00A94F;"></i>
         Pagamento processado com segurança pelo PagBank
        </p>
        <div style="display: flex; align-items: center; gap: 6px; opacity: 0.5;">
         <span style="font-size: 9px; letter-spacing: 0.05em; color: rgba(26,26,26,0.4);">Pix • Cartão • Boleto</span>
        </div>
       </div>
      </div>
     </div>

    </div>
   </form>

  </div>
 </main>

 <!-- TOAST ALERTS CONTAINER -->
 <div class="toast-container" id="toast-container"></div>

 <!-- Lucide Icons CDN -->
 <script src="https://unpkg.com/lucide@latest"></script>
 <!-- JS Scripts -->
 <script src="layout.js"></script>
 <script type="module" src="checkout.js"></script>
</body>

</html>
