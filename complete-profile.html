<!DOCTYPE html>
<html lang="pt-BR">

<head>
 <link rel="icon" type="image/png" href="icone-nitgifts.png">

 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">

 <!-- SEO Meta Tags -->
 <title>Nit Gifts | Completar Perfil</title>
 <meta name="description" content="Complete seu perfil na loja Nit Gifts">
 <meta name="author" content="Nit Gifts">

 <!-- Google Fonts -->
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link
  href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap"
  rel="stylesheet">

 <!-- CSS Stylesheet -->
 <link rel="stylesheet" href="styles.css">
</head>

<body>

 <!-- AUTH SCREEN WRAPPER (Centers the Auth Card) -->
 <main class="auth-screen-wrapper">
  <div class="auth-container">

   <!-- AUTH HEADER (Icon, Title, Subtitle - Dynamic for register or OTP check) -->
   <header class="auth-header">
    <div class="auth-icon-badge" id="auth-header-badge">
     <i data-lucide="map-pin" id="auth-header-icon"></i>
    </div>
    <h1 class="auth-title" id="auth-header-title">Falta Pouco!</h1>
    <p class="auth-subtitle" id="auth-header-subtitle">Precisamos do seu endereço e telefone para a entrega dos seus pedidos.</p>
   </header>

   <!-- AUTH CARD CONTAINER -->
   <section class="auth-card" style="width: 100%; max-width: 500px;">

    <!-- Error Alert box (Hidden by default) -->
    <div class="auth-error-alert" id="profile-error-box" style="display: none;"></div>

    <!-- Complete Profile Form -->
    <form id="complete-profile-form" class="space-y-4">

     <!-- Telefone -->
     <div class="form-section">
      <h3 class="form-section-title" style="font-size: 16px; margin-bottom: 12px; color: var(--color-dark);">Telefone</h3>
      <div class="form-grid grid-contact" style="display: grid; grid-template-columns: 1fr; gap: 12px;">
       <div>
        <input required placeholder="Telefone (WhatsApp)" class="form-input auth-input" id="phone">
       </div>
      </div>
     </div>

     <!-- Endereço de Entrega -->
     <div class="form-section" style="margin-top: 24px; margin-bottom: 24px;">
      <h3 class="form-section-title" style="font-size: 16px; margin-bottom: 12px; color: var(--color-dark);">Endereço de Entrega</h3>
      <div class="form-grid grid-address" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
       <div>
        <input required placeholder="CEP" class="form-input auth-input" id="cep">
       </div>
       <div style="grid-column: 1 / -1;">
        <input required placeholder="Rua / Avenida" class="form-input auth-input" id="address">
       </div>
       <div>
        <input required placeholder="Número" class="form-input auth-input" id="number">
       </div>
       <div>
        <input placeholder="Complemento" class="form-input auth-input" id="complement">
       </div>
       <div>
        <input required placeholder="Cidade" class="form-input auth-input" id="city">
       </div>
       <div>
        <input required placeholder="Estado (UF)" class="form-input auth-input" id="state">
       </div>
      </div>
     </div>

     <!-- Submit Button -->
     <button type="submit" class="checkout-btn auth-btn" id="submit-btn" style="margin-top: 16px; width: 100%;">
      <div class="spinner animate-spin" id="submit-spinner" style="display: none; margin-right: 8px;"></div>
      <span id="submit-btn-text">Salvar Meu Perfil</span>
     </button>

    </form>

    </section>

  </div>
 </main>

 <!-- TOAST ALERTS CONTAINER -->
 <div class="toast-container" id="toast-container"></div>

 <!-- Lucide Icons CDN -->
 <script src="https://unpkg.com/lucide@latest"></script>
 <!-- JS Script -->
 <script src="cep-autofill.js"></script>
 <script type="module" src="complete-profile.js"></script>
</body>

</html>
