<!DOCTYPE html>
<html lang="pt-BR">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">

 <!-- SEO Meta Tags -->
 <title>Nit Gifts | Criar Conta</title>
 <meta name="description" content="Cadastre-se na loja Nit Gifts para criar .">
 <meta name="author" content="Nit Gifts">

 <!-- Google Fonts -->
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link
  href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap"
  rel="stylesheet">

 <!-- CSS Stylesheet -->
 <link rel="stylesheet" href="styles.css">
</head>

<body>

 <!-- AUTH SCREEN WRAPPER (Centers the Auth Card) -->
 <main class="auth-screen-wrapper">
  <div class="auth-container">

   <!-- AUTH HEADER (Icon, Title, Subtitle - Dynamic for register or OTP check) -->
   <header class="auth-header">
    <div class="auth-icon-badge" id="auth-header-badge">
     <i data-lucide="user-plus" id="auth-header-icon"></i>
    </div>
    <h1 class="auth-title" id="auth-header-title">Criar sua conta</h1>
    <p class="auth-subtitle" id="auth-header-subtitle">Cadastre-se para começar</p>
   </header>

   <!-- AUTH CARD CONTAINER -->
   <section class="auth-card" style="width: 100%; max-width: 500px;">

    <!-- Error Alert box (Hidden by default) -->
    <div class="auth-error-alert" id="register-error-box" style="display: none;"></div>

    <!-- STAGE 1: Registration Form (Visible by default) -->
    <form id="register-form" class="space-y-4">

     <!-- Google button -->
     <button type="button" class="btn btn-outline mb-6 w-full" id="google-login-btn"
      style="height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <svg style="width: 20px; height: 20px;" viewBox="0 0 24 24" aria-hidden="true">
       <path
        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"
        fill="#4285F4" />
       <path
        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
        fill="#34A853" />
       <path
        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
        fill="#FBBC05" />
       <path
        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
        fill="#EA4335" />
      </svg>
      Continuar com o Google
     </button>

     <!-- Divider -->
     <div class="auth-divider-container">
      <div class="auth-divider-line">
       <div class="auth-divider-line-inner"></div>
      </div>
      <div class="auth-divider-text-wrapper"><span class="auth-divider-text">ou</span></div>
     </div>

     <!-- Dados Pessoais -->
     <div class="form-section" style="margin-top: 16px;">
      <h3 class="form-section-title" style="font-size: 16px; margin-bottom: 12px; color: var(--color-dark);">Dados Pessoais</h3>
      <div class="form-grid grid-contact" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
       <div style="grid-column: 1 / -1;">
        <input required placeholder="Nome completo" class="form-input auth-input" id="name">
       </div>
       <div style="grid-column: 1 / -1;">
        <input required type="email" placeholder="E-mail" class="form-input auth-input" id="email" autocomplete="email">
       </div>
       <div style="grid-column: 1 / -1;">
        <input required placeholder="Telefone (WhatsApp)" class="form-input auth-input" id="phone">
       </div>
       <div>
        <input required type="password" placeholder="Senha" class="form-input auth-input" id="password" autocomplete="new-password">
       </div>
       <div>
        <input required type="password" placeholder="Confirmar Senha" class="form-input auth-input" id="confirm-password" autocomplete="new-password">
       </div>
      </div>
     </div>

     <!-- Endereço de Entrega -->
     <div class="form-section" style="margin-top: 24px; margin-bottom: 24px;">
      <h3 class="form-section-title" style="font-size: 16px; margin-bottom: 12px; color: var(--color-dark);">Endereço de Entrega</h3>
      <div class="form-grid grid-address" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
       <div>
        <input required placeholder="CEP" class="form-input auth-input" id="cep">
       </div>
       <div style="grid-column: 1 / -1;">
        <input required placeholder="Rua / Avenida" class="form-input auth-input" id="address">
       </div>
       <div>
        <input required placeholder="Número" class="form-input auth-input" id="number">
       </div>
       <div>
        <input placeholder="Complemento" class="form-input auth-input" id="complement">
       </div>
       <div>
        <input required placeholder="Cidade" class="form-input auth-input" id="city">
       </div>
       <div>
        <input required placeholder="Estado (UF)" class="form-input auth-input" id="state">
       </div>
      </div>
     </div>

     <!-- Submit Button -->
     <button type="submit" class="checkout-btn auth-btn" id="submit-btn" style="margin-top: 16px; width: 100%;">
      <div class="spinner animate-spin" id="submit-spinner" style="display: none; margin-right: 8px;"></div>
      <span id="submit-btn-text">Criar conta</span>
     </button>

    </form>

    </section>

   <!-- FOOTER ACTION -->
   <footer class="auth-footer" id="auth-footer-container">
    Já tem uma conta?
    <a href="login.html" id="login-redirect-link">Entrar</a>
   </footer>

  </div>
 </main>

 <!-- TOAST ALERTS CONTAINER -->
 <div class="toast-container" id="toast-container"></div>

 <!-- Lucide Icons CDN -->
 <script src="https://unpkg.com/lucide@latest"></script>
 <!-- JS Script -->
 <script type="module" src="register.js"></script>
</body>

</html>
