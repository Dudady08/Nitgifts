<!DOCTYPE html>
<html lang="pt-BR">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">

 <!-- SEO Meta Tags -->
 <title>Nit Gifts | Criar Conta</title>
 <meta name="description" content="Cadastre-se na loja Nit Gifts para criar .">
 <meta name="author" content="Nit Gifts">

 <!-- Google Fonts -->
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link
  href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap"
  rel="stylesheet">

 <!-- CSS Stylesheet -->
 <link rel="stylesheet" href="styles.css">
</head>

<body>

 <!-- AUTH SCREEN WRAPPER (Centers the Auth Card) -->
 <main class="auth-screen-wrapper">
  <div class="auth-container">

   <!-- AUTH HEADER (Icon, Title, Subtitle - Dynamic for register or OTP check) -->
   <header class="auth-header">
    <div class="auth-icon-badge" id="auth-header-badge">
     <i data-lucide="user-plus" id="auth-header-icon"></i>
    </div>
    <h1 class="auth-title" id="auth-header-title">Criar sua conta</h1>
    <p class="auth-subtitle" id="auth-header-subtitle">Cadastre-se para começar</p>
   </header>

   <!-- AUTH CARD CONTAINER -->
   <section class="auth-card">

    <!-- Error Alert box (Hidden by default) -->
    <div class="auth-error-alert" id="register-error-box" style="display: none;"></div>

    <!-- STAGE 1: Registration Form (Visible by default) -->
    <form id="register-form" class="space-y-4">

     <!-- Google button -->
     <button type="button" class="btn btn-outline mb-6 w-full" id="google-login-btn"
      style="height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <svg style="width: 20px; height: 20px;" viewBox="0 0 24 24" aria-hidden="true">
       <path
        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"
        fill="#4285F4" />
       <path
        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
        fill="#34A853" />
       <path
        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
        fill="#FBBC05" />
       <path
        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
        fill="#EA4335" />
      </svg>
      Continuar com o Google
     </button>

     <!-- Divider -->
     <div class="auth-divider-container">
      <div class="auth-divider-line">
       <div class="auth-divider-line-inner"></div>
      </div>
      <div class="auth-divider-text-wrapper"><span class="auth-divider-text">ou</span></div>
     </div>

     <!-- Email input -->
     <div class="auth-form-group">
      <label class="auth-label" for="email">E-mail</label>
      <div class="input-icon-wrapper">
       <span class="input-icon-left">
        <i data-lucide="mail" style="width: 16px; height: 16px;"></i>
       </span>
       <input type="email" id="email" class="form-input auth-input" placeholder="seu@exemplo.com" required
        autocomplete="email" autofocus>
      </div>
     </div>

     <!-- Password input -->
     <div class="auth-form-group">
      <label class="auth-label" for="password">Senha</label>
      <div class="input-icon-wrapper">
       <span class="input-icon-left">
        <i data-lucide="lock" style="width: 16px; height: 16px;"></i>
       </span>
       <input type="password" id="password" class="form-input auth-input" placeholder="••••••••" required
        autocomplete="new-password">
      </div>
     </div>

     <!-- Confirm Password input -->
     <div class="auth-form-group">
      <label class="auth-label" for="confirm-password">Confirmar Senha</label>
      <div class="input-icon-wrapper">
       <span class="input-icon-left">
        <i data-lucide="lock" style="width: 16px; height: 16px;"></i>
       </span>
       <input type="password" id="confirm-password" class="form-input auth-input" placeholder="••••••••" required
        autocomplete="new-password">
      </div>
     </div>

     <!-- Submit Button -->
     <button type="submit" class="checkout-btn auth-btn" id="submit-btn">
      <div class="spinner animate-spin" id="submit-spinner" style="display: none; margin-right: 8px;"></div>
      <span id="submit-btn-text">Criar conta</span>
     </button>

    </form>

    <!-- STAGE 2: OTP Verification Box (Hidden by default) -->
    <div id="otp-verification-box" style="display: none;">

     <!-- 6-slot input group -->
     <div class="otp-group">
      <input type="text" maxlength="1" class="otp-slot" pattern="[0-9]*" inputmode="numeric" id="otp-0" autofocus>
      <input type="text" maxlength="1" class="otp-slot" pattern="[0-9]*" inputmode="numeric" id="otp-1">
      <input type="text" maxlength="1" class="otp-slot" pattern="[0-9]*" inputmode="numeric" id="otp-2">
      <input type="text" maxlength="1" class="otp-slot" pattern="[0-9]*" inputmode="numeric" id="otp-3">
      <input type="text" maxlength="1" class="otp-slot" pattern="[0-9]*" inputmode="numeric" id="otp-4">
      <input type="text" maxlength="1" class="otp-slot" pattern="[0-9]*" inputmode="numeric" id="otp-5">
     </div>

     <!-- Verify Button -->
     <button type="button" class="checkout-btn auth-btn" id="verify-otp-btn" disabled>
      <div class="spinner animate-spin" id="verify-spinner" style="display: none; margin-right: 8px;"></div>
      <span id="verify-btn-text">Verificar</span>
     </button>

     <!-- Resend Action Link -->
     <p class="auth-success-text" style="margin-top: 16px; font-size: 13px; color: var(--color-dark-translucent);">
      Não recebeu o código?
      <button type="button" class="ruler-link-btn" id="resend-otp-btn"
       style="vertical-align: baseline; font-size: 13px; padding: 0;">
       Reenviar
      </button>
     </p>

    </div>

   </section>

   <!-- FOOTER ACTION -->
   <footer class="auth-footer" id="auth-footer-container">
    Já tem uma conta?
    <a href="login.html" id="login-redirect-link">Entrar</a>
   </footer>

  </div>
 </main>

 <!-- TOAST ALERTS CONTAINER -->
 <div class="toast-container" id="toast-container"></div>

 <!-- Lucide Icons CDN -->
 <script src="https://unpkg.com/lucide@latest"></script>
 <!-- JS Script -->
 <script src="register.js"></script>
</body>

</html>
