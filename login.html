<!DOCTYPE html>
<html lang="pt-BR">

<head>
 <link rel="icon" type="image/png" href="icone-nitgifts.png">

 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">

 <!-- SEO Meta Tags -->
 <title>Nit Gifts | Acessar Conta</title>
 <meta name="description" content="Acesse sua conta Nit Gifts para gerenciar seus pedidos.">
 <meta name="author" content="Nit Gifts">

 <!-- Google Fonts -->
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link
  href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap"
  rel="stylesheet">

 <!-- CSS Stylesheet -->
 <link rel="stylesheet" href="styles.css">
</head>

<body>

 <!-- AUTH SCREEN WRAPPER (Centers the Auth Card) -->
 <main class="auth-screen-wrapper">
  <div class="auth-container">

   <!-- AUTH HEADER (Icon, Title, Subtitle) -->
   <header class="auth-header">
    <div class="auth-icon-badge">
     <i data-lucide="log-in"></i>
    </div>
    <h1 class="auth-title">Bem-vindo de volta</h1>
    <p class="auth-subtitle">Acesse sua conta</p>
   </header>

   <!-- AUTH CARD CONTAINER -->
   <section class="auth-card">

    <!-- Google login button -->
    <button type="button" class="btn btn-outline mb-6 w-full" id="google-login-btn"
     style="height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px;">
     <!-- Inline Google Logo SVG -->
     <svg style="width: 20px; height: 20px;" viewBox="0 0 24 24" aria-hidden="true">
      <path
       d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"
       fill="#4285F4" />
      <path
       d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
       fill="#34A853" />
      <path
       d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
       fill="#FBBC05" />
      <path
       d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
       fill="#EA4335" />
     </svg>
     Continuar com o Google
    </button>

    <!-- Divider wrapper -->
    <div class="auth-divider-container">
     <div class="auth-divider-line">
      <div class="auth-divider-line-inner"></div>
     </div>
     <div class="auth-divider-text-wrapper"><span class="auth-divider-text">ou</span></div>
    </div>

    <!-- Error Alert (Hidden by default) -->
    <div class="auth-error-alert" id="login-error-box" style="display: none;">
     E-mail ou senha inválidos
    </div>

    <!-- Credentials Form -->
    <form id="login-form" class="space-y-4">

     <!-- E-mail input -->
     <div class="auth-form-group">
      <label class="auth-label" for="email">E-mail</label>
      <div class="input-icon-wrapper">
       <span class="input-icon-left">
        <i data-lucide="mail" style="width: 16px; height: 16px;"></i>
       </span>
       <input type="email" id="email" class="form-input auth-input" placeholder="seu@exemplo.com" required
        autocomplete="email" autofocus>
      </div>
     </div>

     <!-- Password input -->
     <div class="auth-form-group">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
       <label class="auth-label" for="password" style="margin-bottom: 0;">Senha</label>
       <a href="forgot-password.html" class="contact-info-link" style="font-size: 12px; text-decoration: none;">
        Esqueceu a senha?
       </a>
      </div>
      <div class="input-icon-wrapper">
       <span class="input-icon-left">
        <i data-lucide="lock" style="width: 16px; height: 16px;"></i>
       </span>
       <input type="password" id="password" class="form-input auth-input" placeholder="••••••••" required
        autocomplete="current-password">
      </div>
     </div>

     <!-- Submit Button -->
     <button type="submit" class="checkout-btn auth-btn" id="submit-btn">
      <div class="spinner animate-spin" id="submit-spinner" style="display: none; margin-right: 8px;"></div>
      <span id="submit-btn-text">Entrar</span>
     </button>

    </form>

   </section>

   <!-- FOOTER ACTION -->
   <footer class="auth-footer">
    Não tem uma conta?
    <a href="register.html" id="register-link">Cadastre-se</a>
   </footer>

  </div>
 </main>

 <!-- Lucide Icons CDN -->
 <script src="https://unpkg.com/lucide@latest"></script>
 <!-- JS Script -->
 <script type="module" src="login.js"></script>
</body>

</html>
