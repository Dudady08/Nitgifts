<!DOCTYPE html>
<html lang="pt-BR">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">

 <!-- SEO Meta Tags -->
 <title>Nit Gifts | Recuperar Senha</title>
 <meta name="description" content="Recupere sua senha com facilidade no Nitgift.">
 <meta name="author" content="Nit Gifts">

 <!-- Google Fonts -->
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link
  href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap"
  rel="stylesheet">

 <!-- CSS Stylesheet -->
 <link rel="stylesheet" href="styles.css">
</head>

<body>

 <!-- AUTH SCREEN WRAPPER (Centers the Auth Card) -->
 <main class="auth-screen-wrapper">
  <div class="auth-container">

   <!-- AUTH HEADER (Icon, Title, Subtitle) -->
   <header class="auth-header">
    <div class="auth-icon-badge">
     <i data-lucide="mail"></i>
    </div>
    <h1 class="auth-title">Recuperar Senha</h1>
    <p class="auth-subtitle" id="auth-subtitle-text">Enviaremos um link para você redefinir sua senha</p>
   </header>

   <!-- AUTH CARD CONTAINER -->
   <section class="auth-card">

    <!-- Redefine password request form (Visible by default) -->
    <form id="forgot-password-form" class="space-y-4">

     <div class="auth-form-group">
      <label class="auth-label" for="email">Endereço de e-mail</label>
      <div class="input-icon-wrapper">
       <span class="input-icon-left">
        <i data-lucide="mail" style="width: 16px; height: 16px;"></i>
       </span>
       <input type="email" id="email" class="form-input auth-input" placeholder="seu@exemplo.com" required
        autocomplete="email" autofocus>
      </div>
     </div>

     <!-- Submit Button -->
     <button type="submit" class="checkout-btn auth-btn" id="submit-btn">
      <div class="spinner animate-spin" id="submit-spinner" style="display: none; margin-right: 8px;"></div>
      <span id="submit-btn-text">Enviar link de recuperação</span>
     </button>

    </form>

    <!-- Success Message confirmation (Hidden by default) -->
    <div id="success-confirmation" style="display: none;">
     <p class="auth-success-text">
      Se existir uma conta com esse e-mail, você receberá um link para redefinir sua senha em breve.
     </p>
    </div>

   </section>

   <!-- FOOTER ACTION -->
   <footer class="auth-footer" id="auth-footer-container">
    <a href="login.html" id="back-to-login-link">
     <i data-lucide="arrow-left" style="width: 12px; height: 12px;"></i>
     Voltar para o login
    </a>
   </footer>

  </div>
 </main>

 <!-- Lucide Icons CDN -->
 <script src="https://unpkg.com/lucide@latest"></script>
 <!-- JS Script -->
 <script src="forgot-password.js"></script>
</body>

</html>
