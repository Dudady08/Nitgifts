<!DOCTYPE html>
<html lang="pt-BR">

<head>
 <link rel="icon" type="image/png" href="icone-nitgifts.png">

 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">

 <!-- SEO Meta Tags -->
 <title>Nit Gifts | Redefinir Senha</title>
 <meta name="description" content="Redefina sua senha da conta Nitgift.">
 <meta name="author" content="Nit Gifts">

 <!-- Google Fonts -->
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link
  href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap"
  rel="stylesheet">

 <!-- CSS Stylesheet -->
 <link rel="stylesheet" href="styles.css">
</head>

<body>

 <!-- AUTH SCREEN WRAPPER (Centers the Auth Card) -->
 <main class="auth-screen-wrapper">
  <div class="auth-container">

   <!-- AUTH HEADER (Icon, Title, Subtitle - Dynamic based on resetToken validation) -->
   <header class="auth-header">
    <div class="auth-icon-badge" id="auth-header-badge">
     <i data-lucide="lock" id="auth-header-icon"></i>
    </div>
    <h1 class="auth-title" id="auth-header-title">Nova Senha</h1>
    <p class="auth-subtitle" id="auth-header-subtitle">Insira sua nova senha abaixo</p>
   </header>

   <!-- AUTH CARD CONTAINER -->
   <section class="auth-card">

    <!-- Error Alert box (Hidden by default) -->
    <div class="auth-error-alert" id="reset-error-box" style="display: none;"></div>

    <!-- STAGE 1: Reset Password Form (Visible by default, hidden if token is invalid) -->
    <form id="reset-password-form" class="space-y-4">

     <!-- New Password input -->
     <div class="auth-form-group">
      <label class="auth-label" for="password">Nova Senha</label>
      <div class="input-icon-wrapper">
       <span class="input-icon-left">
        <i data-lucide="lock" style="width: 16px; height: 16px;"></i>
       </span>
       <input type="password" id="password" class="form-input auth-input" placeholder="••••••••" required
        autocomplete="new-password" autofocus>
      </div>
     </div>

     <!-- Confirm Password input -->
     <div class="auth-form-group">
      <label class="auth-label" for="confirm-password">Confirmar Senha</label>
      <div class="input-icon-wrapper">
       <span class="input-icon-left">
        <i data-lucide="lock" style="width: 16px; height: 16px;"></i>
       </span>
       <input type="password" id="confirm-password" class="form-input auth-input" placeholder="••••••••" required
        autocomplete="new-password">
      </div>
     </div>

     <!-- Submit Button -->
     <button type="submit" class="checkout-btn auth-btn" id="submit-btn">
      <div class="spinner animate-spin" id="submit-spinner" style="display: none; margin-right: 8px;"></div>
      <span id="submit-btn-text">Redefinir senha</span>
     </button>

    </form>

    <!-- STAGE 2: Invalid Link error block (Hidden by default, shown if no token) -->
    <div id="invalid-link-box" style="display: none;">
     <p class="auth-success-text">
      O link que você utilizou parece estar incompleto ou é inválido. Por favor, solicite um novo e-mail de
      redefinição de senha.
     </p>
    </div>

   </section>

   <!-- FOOTER ACTION (Only visible if token is invalid) -->
   <footer class="auth-footer" id="auth-footer-container" style="display: none;">
    <a href="forgot-password.html" id="reset-footer-link">
     <i data-lucide="arrow-left" style="width: 12px; height: 12px;"></i>
     Solicitar um novo link
    </a>
   </footer>

  </div>
 </main>

 <!-- Lucide Icons CDN -->
 <script src="https://unpkg.com/lucide@latest"></script>
 <!-- JS Script -->
 <script src="reset-password.js"></script>
</body>

</html>
